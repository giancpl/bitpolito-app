# Archived server/PWA installation only. The distributed Android APK does not use this backend configuration.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      APP_ORIGIN: http://localhost:3001
      COOKIE_SECURE: "false"
      RELAY_URLS: ${RELAY_URLS-wss://nrs.primal.net}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - app-data:/app/data
    restart: unless-stopped
volumes:
  app-data:
