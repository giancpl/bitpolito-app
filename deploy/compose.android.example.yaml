# Optional override for the future production pilot. Use an external secret path:
# docker compose --env-file .env.production -f compose.production.yaml \
#   -f deploy/compose.android.example.yaml config
# Supply FCM_CREDENTIAL_FILE as an absolute path, never inside the build context.
services:
  app:
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set the Firebase project id}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - type: bind
        source: ${FCM_CREDENTIAL_FILE:?Set an absolute external service-account file path}
        target: /run/secrets/firebase-service-account.json
        read_only: true
