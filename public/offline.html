<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#001ce0" />
    <title>Offline · BitPolito</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f9fb;
        color: #20222d;
        font-family: system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 430px;
        padding: 38px;
        border: 1px solid #e5e9f2;
        border-radius: 12px;
        background: white;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 12px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.04em;
        margin: 24px 0 14px;
      }
      p {
        line-height: 1.8;
        color: #68738a;
        font-size: 14px;
      }
      a {
        display: inline-block;
        padding: 12px 18px;
        margin-top: 14px;
        border-radius: 6px;
        background: #001ce0;
        color: white;
        text-decoration: none;
        font-size: 14px;
      }
      a:focus-visible {
        outline: 3px solid #7184ff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="BitPolito" />
      <h1>Let’s reconnect.</h1>
      <p>
        BitPolito needs a connection to load your tools and office status. Check that
        the app is running on this PC, then try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
