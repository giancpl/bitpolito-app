apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release metadata and signing are supplied by the environment or gradle properties
// (e.g. -PversionCode=12 -PversionName=1.2), never committed to the repository.
def releaseSetting = { String name ->
    def value = System.getenv(name) ?: project.findProperty(name)?.toString()
    value?.trim() ? value.trim() : null
}
def teamOwnerNpub = releaseSetting('BITPOLITO_OWNER_NPUB') ?: ''
def teamAdminNpubs = releaseSetting('BITPOLITO_ADMIN_NPUBS') ?: ''
def quoteBuildConfig = { String v -> '"' + v.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def releaseKeystore = releaseSetting('BITPOLITO_KEYSTORE')
def releaseSigning = releaseKeystore != null &&
        ['BITPOLITO_KEYSTORE_PASSWORD', 'BITPOLITO_KEY_ALIAS', 'BITPOLITO_KEY_PASSWORD'].every { releaseSetting(it) != null }
if (releaseKeystore != null && !releaseSigning) {
    logger.warn('BITPOLITO_KEYSTORE is set but its passwords or alias are missing: release builds stay unsigned.')
}

android {
    namespace = "it.bitpolito.hub"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "it.bitpolito.hub"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def requestedAbi = project.findProperty('androidAbi')?.toString()
        if (requestedAbi != null) {
            if (!(requestedAbi in ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'])) {
                throw new GradleException('Unsupported androidAbi')
            }
            ndk { abiFilters requestedAbi }
        }
        versionCode((project.findProperty('versionCode') ?: '1').toString().toInteger())
        versionName((project.findProperty('versionName') ?: '1.0').toString())
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main {
            java.srcDir '../../.android-local/marmot/marmotkit-android-0.19.0/kotlin'
            jniLibs.srcDir '../../.android-local/marmot/marmotkit-android-0.19.0/jniLibs'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    flavorDimensions += "environment"
    productFlavors {
        sandbox {
            dimension "environment"
            applicationIdSuffix ".sandbox"
            versionNameSuffix "-sandbox"
            buildConfigField "boolean", "SANDBOX", "true"
            buildConfigField "String", "OWNER_NPUB", '""'
            buildConfigField "String", "ADMIN_NPUBS", '""'
        }
        team {
            dimension "environment"
            buildConfigField "boolean", "SANDBOX", "false"
            buildConfigField "String", "OWNER_NPUB", quoteBuildConfig(teamOwnerNpub)
            buildConfigField "String", "ADMIN_NPUBS", quoteBuildConfig(teamAdminNpubs)
        }
    }
    signingConfigs {
        debug {
            storeFile file('../../.android-local/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseSetting('BITPOLITO_KEYSTORE_PASSWORD')
                keyAlias releaseSetting('BITPOLITO_KEY_ALIAS')
                keyPassword releaseSetting('BITPOLITO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8 stays off: JNA and the uniffi-generated MarmotKit bindings resolve classes,
            // callback interfaces and native structures by reflection. Enabling minification
            // needs dedicated keep rules and a full device test of the Marmot flows first.
            minifyEnabled false
            if (releaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Direct Gradle invocations must uphold the same boundary as android-build.sh.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.contains('Team') }) {
        if (!fileTree('src/main/assets/public').matching { include '**/*AndroidSandbox*' }.isEmpty()) {
            throw new GradleException('Sandbox assets detected. Build the team frontend with scripts/android-build.sh team')
        }
    }
}
